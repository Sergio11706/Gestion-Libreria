<div class="login-wrapper">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon">
        <i class="fa-solid fa-user"></i>
      </div>
      <h1 class="brand-title">Acceso empleado</h1>
      <p class="brand-subtitle">Ingresá con tu usuario de empleado</p>
    </div>

    <div class="login-divider"></div>

    <form #loginForm="ngForm" class="login-form" (ngSubmit)="iniciarSesion(loginForm)" novalidate>
      <div class="alert-error" *ngIf="errorMensaje">
        <i class="fa-solid fa-circle-exclamation"></i>
        {{ errorMensaje }}
      </div>

      <div class="form-group">
        <label class="form-label" for="username">Usuario</label>
        <div class="input-wrapper">
          <span class="input-icon"><i class="fa-solid fa-user"></i></span>
          <input
            id="username"
            class="form-input"
            type="text"
            [(ngModel)]="nombreUsuario"
            name="nombreUsuario"
            required
            minlength="3"
            #usuarioField="ngModel"
            [disabled]="cargando"
          />
        </div>
        <span class="field-error" *ngIf="(usuarioField.touched || loginForm.submitted) && usuarioField.errors?.['required']">
          El usuario es obligatorio.
        </span>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <div class="input-wrapper">
          <span class="input-icon"><i class="fa-solid fa-lock"></i></span>
          <input
            id="password"
            class="form-input"
            type="password"
            [(ngModel)]="password"
            name="password"
            required
            minlength="4"
            #passwordField="ngModel"
            [disabled]="cargando"
          />
        </div>
        <span class="field-error" *ngIf="(passwordField.touched || loginForm.submitted) && passwordField.errors?.['required']">
          La contraseña es obligatoria.
        </span>
      </div>

      <button class="btn-login" type="submit" [disabled]="cargando">
        {{ cargando ? 'Ingresando...' : 'Iniciar Sesión' }}
      </button>
    </form>

    <div class="login-footer">
      <p class="footer-text">
        <a routerLink="/login">Volver al acceso encargado</a>
      </p>
    </div>
  </div>
</div>

services:
  db:
    image: mysql:8.0
    container_name: gestion_libreria_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3307:3306"
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  backend:
    build:
      context: ./backend
    container_name: gestion_libreria_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      DB_PORT: 3306
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: gestion_libreria_frontend
    restart: unless-stopped
    ports:
      - "4200:4200"
    depends_on:
      - backend

  nginx:
    build:
      context: ./nginx
    container_name: gestion_libreria_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend

  # Backup automático semanal de usuarios y libros
  backup:
    build:
      context: ./backup
    container_name: gestion_libreria_backup
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
      BACKUP_TABLES: "${BACKUP_TABLES:-usuarios,libros}"
      BACKUP_RETENTION_WEEKS: "${BACKUP_RETENTION_WEEKS:-4}"
      BACKUP_CRON_SCHEDULE: "${BACKUP_CRON_SCHEDULE:-0 3 * * 0}"
      BACKUP_RUN_ON_START: "${BACKUP_RUN_ON_START:-false}"
    volumes:
      - ./backups:/backups
    depends_on:
      db:
        condition: service_healthy

volumes:
  db_data:

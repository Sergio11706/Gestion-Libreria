version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: gestion_libreria_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "${DB_PORT}:3306"
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: gestion_libreria_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
    ports:
      - "${BACKEND_PORT}:3000"
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: gestion_libreria_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT}:4200"
    depends_on:
      - backend

volumes:
  db_data:

version: '3.9'

services:
  db:
    image: mysql:8.0
    container_name: gestion_libreria_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - db_data:/var/lib/mysql

  backend:
    build:
      context: ./backend
    container_name: gestion_libreria_backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      DB_HOST: db
    depends_on:
      - db

  frontend:
    build:
      context: ./frontend
    container_name: gestion_libreria_frontend
    restart: unless-stopped
    depends_on:
      - backend

  # Nginx con SSL/HTTPS
  nginx:
    build:
      context: ./nginx
    container_name: gestion_libreria_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - frontend
      - backend

volumes:
  db_data:

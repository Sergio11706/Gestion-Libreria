<div class="login-wrapper">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon">
        <i class="fa-solid fa-book-open"></i>
      </div>
      <h1 class="brand-title">Gestión de Librería</h1>
      <p class="brand-subtitle">{{ subtitulo }}</p>
    </div>

    <div class="login-divider"></div>

    <form #loginForm="ngForm" class="login-form" (ngSubmit)="iniciarSesion(loginForm)" novalidate>
      <div class="alert-error" *ngIf="errorMensaje">
        <i class="fa-solid fa-circle-exclamation"></i>
        {{ errorMensaje }}
      </div>

      <div class="form-group">
        <label class="form-label" for="username">Usuario</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <i class="fa-solid fa-user"></i>
          </span>
          <input
            id="username"
            class="form-input"
            type="text"
            placeholder="Ingrese su usuario"
            autocomplete="username"
            [(ngModel)]="nombreUsuario"
            name="nombreUsuario"
            required
            minlength="3"
            maxlength="50"
            pattern="^[a-zA-Z0-9._-]+$"
            #usuarioField="ngModel"
            [disabled]="cargando"
          />
        </div>
        <span class="field-error" *ngIf="(usuarioField.touched || loginForm.submitted) && usuarioField.errors?.['required']">
          El usuario es obligatorio.
        </span>
        <span class="field-error" *ngIf="(usuarioField.touched || loginForm.submitted) && usuarioField.errors?.['minlength']">
          El usuario debe tener al menos 3 caracteres.
        </span>
        <span class="field-error" *ngIf="(usuarioField.touched || loginForm.submitted) && usuarioField.errors?.['pattern']">
          Solo letras, números, puntos, guiones y guiones bajos.
        </span>
      </div>

      <div class="form-group">
        <label class="form-label" for="password">Contraseña</label>
        <div class="input-wrapper">
          <span class="input-icon">
            <i class="fa-solid fa-lock"></i>
          </span>
          <input
            id="password"
            class="form-input"
            type="password"
            placeholder="Ingrese su contraseña"
            autocomplete="current-password"
            [(ngModel)]="password"
            name="password"
            required
            minlength="4"
            maxlength="100"
            #passwordField="ngModel"
            [disabled]="cargando"
          />
        </div>
        <span class="field-error" *ngIf="(passwordField.touched || loginForm.submitted) && passwordField.errors?.['required']">
          La contraseña es obligatoria.
        </span>
        <span class="field-error" *ngIf="(passwordField.touched || loginForm.submitted) && passwordField.errors?.['minlength']">
          La contraseña debe tener al menos 4 caracteres.
        </span>
      </div>

      <div class="form-options">
        <label class="checkbox-label">
          <input
            class="checkbox-input"
            type="checkbox"
            [(ngModel)]="recordarme"
            name="recordarme"
            [disabled]="cargando"
          />
          <span class="checkbox-custom"></span>
          <span class="checkbox-text">Recordarme</span>
        </label>
      </div>

      <button class="btn-login" type="submit" [disabled]="cargando">
        <i class="fa-solid fa-right-to-bracket"></i>
        {{ cargando ? 'Ingresando...' : 'Iniciar Sesión' }}
      </button>
    </form>

    <div class="login-footer">
      <p class="footer-text">
        <i class="fa-solid fa-shield-halved"></i>
        Acceso seguro al sistema
      </p>
    </div>
  </div>
</div>
